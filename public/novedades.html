<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novedades | Rivera Shop</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="stylesheet" href="dashboard.css?v=7">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<header class="catalogo-header">
  <div class="container catalogo-nav">
    <a href="index.html" class="logo">
      <img src="images/Logo.jpeg" alt="Rivera Shop">
    </a>

      <button type="button" id="btnMenuMobile" class="menu-label">
        <i class="bi bi-list"></i>
      </button>

        <nav class="nav-link" id="navbarMobile">
            <a href="index.html" class="activo">Inicio</a>
            <a href="catalogo.html" >Catalogo</a>
            <a href="preventa.html">Preventa</a>
            <a href="novedades.html">Novedades</a>
            <a href="#">Contacto</a>
        </nav>

    <div class="catalogo-search">
      <input type="text" id="buscarNovedades" placeholder="Buscar novedades...">
      <span>🔍</span>
    </div>
  </div>
</header>

<main class="catalogo-page container">

  <div class="breadcrumb">
    Inicio › Novedades
  </div>

  <section class="catalogo-top">
    <div>
      <h1>Novedades</h1>
      <p>Productos agregados recientemente a Rivera Shop.</p>
    </div>

    <div class="catalogo-controls">
      <select id="ordenNovedades">
        <option value="recientes">Más recientes</option>
        <option value="mayor">Mayor precio</option>
        <option value="menor">Menor precio</option>
        <option value="nombre">Nombre A-Z</option>
      </select>
    </div>
  </section>

  <section class="catalogo-main">
    <div class="catalogo-info">
      <span id="contadorNovedades">Mostrando novedades</span>
    </div>

    <div id="productosNovedades" class="catalogo-grid"></div>
  </section>

</main>

<div class="modal-checkout" id="modalCheckout">
    <div class="modal-checkout-content">
        <span class="cerrar-checkout" id="cerrarCheckout">&times;</span>

        <h2>Finalizar compra</h2>

        <form id="formCheckout">
        <input type="text" id="checkoutNombre" placeholder="Nombre completo" required>
        <input type="tel" id="checkoutWhatsapp" placeholder="WhatsApp" required>
        <input type="email" id="checkoutCorreo" placeholder="Correo electrónico">

        <input type="text" id="checkoutDireccion" placeholder="Dirección" required>
        <input type="text" id="checkoutCiudad" placeholder="Ciudad" required>

        <input type="hidden" id="checkoutMetodoPago" required>

        <div class="metodos-pago">
            <button type="button" class="metodo-pago-btn" data-metodo-pago="Nequi">
                Nequi
            </button>

            <button type="button" class="metodo-pago-btn" data-metodo-pago="Bancolombia">
                Bancolombia
            </button>

            </div>

            <div class="info-metodo-pago" id="infoMetodoPago">
            Selecciona un método de pago para ver la información.
        </div>

        <input type="file" id="checkoutComprobante" accept="image/*,.pdf">

        <textarea id="checkoutNotas" placeholder="Notas adicionales"></textarea>

        <button type="submit">Enviar pedido</button>
        </form>
    </div>
</div>
<script src="scripts.js?v=17"></script>

</body>
</html>
