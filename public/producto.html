<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del producto | Rivera Shop</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    
</head>
<body>

 
      <header class="catalogo-header">
        <div class="container catalogo-nav">
          <a href="index.html" class="logo">
            <img src="images/Logo.png" alt="Rivera Shop">
          </a>

          <button type="button" id="btnMenuMobile" class="menu-label">
            <i class="bi bi-list"></i>
          </button>

            <nav class="nav-link" id="navbarMobile">
                <a href="index.html" class="activo">Inicio</a>
                <a href="catalogo.html" >Catalogo</a>
                <a href="preventa.html">Preventa</a>
                <a href="novedades.html">Novedades</a>
                <a href="#">Contacto</a>
              <div class="currency-switch">
                <button type="button" id="btnCOP">
                    🇨🇴 <span>COP</span>
                </button>

                <button type="button" id="btnUSD">
                    🇺🇸 <span>USD</span>
                </button>
              </div>
            </nav>
          <div class="catalogo-search">
            <input type="text" id="buscarCatalogo" placeholder="Buscar productos...">
            <span>🔍</span>
          </div>
        </div>
      </header>


  <main class="producto-detalle-page">

    <section class="producto-detalle container" id="productoDetalle">
      <p>Cargando producto...</p>
    </section>

    <section class="comentarios-producto container">
      <h2>Comentarios</h2>

      <div class="comentario-form">
        <input type="text" id="nombreComentario" placeholder="Tu nombre">

        <textarea 
          id="textoComentario" 
          placeholder="Escribe tu comentario"
        ></textarea>

        <button id="guardarComentario">
          Enviar comentario
        </button>
      </div>

      <div id="listaComentarios" class="lista-comentarios"></div>
    </section>

    <section class="productos-similares container">
      <h2>Productos similares</h2>

      <div id="productosSimilares" class="productos-grid"></div>
    </section>

  </main>

  <div class="modal-checkout" id="modalCheckout">
  <div class="modal-checkout-content">
    <span class="cerrar-checkout" id="cerrarCheckout">&times;</span>

    <h2>Finalizar compra</h2>

    <form id="formCheckout">
      <input type="text" id="checkoutNombre" placeholder="Nombre completo" required>
      <input type="tel" id="checkoutWhatsapp" placeholder="WhatsApp" required>
      <input type="email" id="checkoutCorreo" placeholder="Correo electrónico">

      <input type="text" id="checkoutDireccion" placeholder="Dirección" required>
      <input type="text" id="checkoutCiudad" placeholder="Ciudad" required>

      <div class="metodos-pago">
      <button type="button" class="metodo-pago-btn" data-metodo-pago="Nequi">
          Nequi
      </button>

      <button type="button" class="metodo-pago-btn" data-metodo-pago="Bancolombia">
          Bancolombia
      </button>

      <button type="button" class="metodo-pago-btn" data-metodo-pago="Contra entrega">
          Contra entrega
      </button>
      </div>

      <input type="file" id="checkoutComprobante" accept="image/*,.pdf">

      <textarea id="checkoutNotas" placeholder="Notas adicionales"></textarea>

      <button type="submit">Enviar pedido</button>
    </form>
  </div>
  </div>

  <button id="btnCarritoFlotante" class="carrito-flotante">
  <i class="bi bi-cart"></i> <span id="contadorCarrito">0</span>
  </button>
<script src="scripts.js?v=14"></script>

</body>
</html>
