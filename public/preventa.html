<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preventa | Rivera Shop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<header class="catalogo-header">
  <div class="container catalogo-nav">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Rivera Shop">
    </a>

    <button type="button" id="btnMenuMobile" class="menu-label">
      <i class="bi bi-list"></i>
    </button>

    <nav class="nav-link" id="navbarMobile">
        <a href="index.html" class="activo">Inicio</a>
        <a href="catalogo.html" >Catalogo</a>
        <a href="Preventa.html">Preventa</a>
        <a href="novedades.html">Novedades</a>
        <a href="#">Contacto</a>
      <div class="currency-switch">
        <button type="button" id="btnCOP">
            🇨🇴 <span>COP</span>
        </button>

        <button type="button" id="btnUSD">
            🇺🇸 <span>USD</span>
        </button>
      </div>
    </nav>

    <div class="catalogo-search">
      <input type="text" id="buscarPreventa" placeholder="Buscar en preventa...">
      <span>🔍</span>
    </div>
  </div>
</header>

<main class="catalogo-page container">

  <div class="breadcrumb">
    Inicio › Preventa
  </div>

  <section class="catalogo-top">
    <div>
      <h1>Preventa</h1>
      <p>Productos disponibles para reservar antes de su llegada.</p>
    </div>

    <div class="catalogo-controls">
      <select id="ordenPreventa">
        <option value="recientes">Más recientes</option>
        <option value="mayor">Mayor precio</option>
        <option value="menor">Menor precio</option>
        <option value="nombre">Nombre A-Z</option>
      </select>
    </div>
  </section>

  <section class="catalogo-main">
    <div class="catalogo-info">
      <span id="contadorPreventa">Mostrando productos en preventa</span>
    </div>

    <div id="productosPreventa" class="catalogo-grid"></div>
  </section>

</main>

<div class="modal-checkout" id="modalCheckout">
  <div class="modal-checkout-content">
    <span class="cerrar-checkout" id="cerrarCheckout">&times;</span>

    <h2>Finalizar compra</h2>

    <form id="formCheckout">
      <input type="text" id="checkoutNombre" placeholder="Nombre completo" required>
      <input type="tel" id="checkoutWhatsapp" placeholder="WhatsApp" required>
      <input type="email" id="checkoutCorreo" placeholder="Correo electrónico">

      <input type="text" id="checkoutDireccion" placeholder="Dirección" required>
      <input type="text" id="checkoutCiudad" placeholder="Ciudad" required>

      <select id="checkoutMetodoPago" required>
        <option value="">Selecciona método de pago</option>
        <option value="Nequi">Nequi</option>
        <option value="Bancolombia">Bancolombia</option>
        <option value="Contra entrega">Contra entrega</option>
      </select>

      <input type="file" id="checkoutComprobante" accept="image/*,.pdf">

      <textarea id="checkoutNotas" placeholder="Notas adicionales"></textarea>

      <button type="submit">Enviar pedido</button>
    </form>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
