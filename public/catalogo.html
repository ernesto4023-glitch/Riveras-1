<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Rivera Shop</title>
  <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

<header class="catalogo-header">
  <div class="container catalogo-nav">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Rivera Shop">
    </a>

    <nav class="nav-link">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html" class="activo">Catalogo</a>
      <a href="#">Tienda</a>
      <a href="#">Ofertas</a>
      <a href="#">Novedades</a>
      <a href="#">Contacto</a>
    </nav>

    <div class="catalogo-search">
      <input type="text" id="buscarCatalogo" placeholder="Buscar productos...">
      <span>🔍</span>
    </div>
  </div>
</header>

<main class="catalogo-page container">

  <div class="breadcrumb">
    Inicio › Catálogo
  </div>

  <section class="catalogo-top">
    <div>
      <h1>Catálogo</h1>
      <p>Explora todos nuestros productos</p>
    </div>

    <div class="catalogo-controls">
      <select id="ordenCatalogo">
        <option value="recientes">Más recientes</option>
        <option value="mayor">Mayor precio</option>
        <option value="menor">Menor precio</option>
        <option value="nombre">Nombre A-Z</option>
      </select>
    </div>
  </section>

  <section class="catalogo-layout">

    <aside class="catalogo-sidebar">
      <h3>Categorías</h3>

      <div id="filtrosCategorias" class="filtros-categorias"></div>

      <div class="filtro-box">
        <h3>Filtrar por precio</h3>

        <div class="precio-inputs">
          <input type="number" id="precioMin" placeholder="$ 0">
          <input type="number" id="precioMax" placeholder="$ 200">
        </div>

        <button id="filtrarPrecio">Filtrar</button>
      </div>
    </aside>

    <section class="catalogo-main">
      <div class="catalogo-info">
        <span id="contadorCatalogo">Mostrando productos</span>
      </div>

      <div id="productosCatalogo" class="catalogo-grid"></div>
    </section>

  </section>

</main>

<button id="btnCarritoFlotante" class="carrito-flotante">
<i class="bi bi-cart"></i> <span id="contadorCarrito">0</span>
</button>

<script src="scripts.js"></script>
</body>
</html>
