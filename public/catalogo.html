<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Rivera Shop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

<header class="catalogo-header">
  <div class="container catalogo-nav">
    <a href="index.html" class="logo">
      <img src="images/Logo.jpeg" alt="Rivera Shop">
    </a>

    <button type="button" id="btnMenuMobile" class="menu-label">
      <i class="bi bi-list"></i>
    </button>

      <nav class="nav-link" id="navbarMobile">
          <a href="index.html" class="activo">Inicio</a>
          <a href="catalogo.html" >Catalogo</a>
          <a href="preventa.html">Preventa</a>
          <a href="novedades.html">Novedades</a>
          <a href="#">Contacto</a>
          <div class="currency-switch">
          <button type="button" id="btnCOP">
              🇨🇴 <span>COP</span>
          </button>

          <button type="button" id="btnUSD">
              🇺🇸 <span>USD</span>
          </button>
        </div>
      </nav>

    <div class="catalogo-search">
      <input type="text" id="buscarCatalogo" placeholder="Buscar productos...">
      <span>🔍</span>
    </div>
  </div>
</header>

<main class="catalogo-page container">

  <div class="breadcrumb">
    Inicio › Catálogo
  </div>

  <section class="catalogo-top">
    <div>
      <h1>Catálogo</h1>
      <p>Explora todos nuestros productos</p>
    </div>

    <div class="catalogo-controls">
      <select id="ordenCatalogo">
        <option value="recientes">Más recientes</option>
        <option value="mayor">Mayor precio</option>
        <option value="menor">Menor precio</option>
        <option value="nombre">Nombre A-Z</option>
      </select>
    </div>
  </section>

  <section class="catalogo-layout">

    <aside class="catalogo-sidebar">
      <h3>Categorías</h3>

      <div id="filtrosCategorias" class="filtros-categorias"></div>

      <div class="filtro-box">
        <h3>Filtrar por precio</h3>

        <div class="precio-inputs">
          <input type="number" id="precioMin" placeholder="$ 0">
          <input type="number" id="precioMax" placeholder="$ 200">
        </div>

        <button id="filtrarPrecio">Filtrar</button>
      </div>
    </aside>

    <section class="catalogo-main">
      <div class="catalogo-info">
        <span id="contadorCatalogo">Mostrando productos</span>
      </div>

      <div id="productosCatalogo" class="catalogo-grid"></div>
    </section>

  </section>

</main>

<div class="modal-checkout" id="modalCheckout">
  <div class="modal-checkout-content">
    <span class="cerrar-checkout" id="cerrarCheckout">&times;</span>

    <h2>Finalizar compra</h2>

    <form id="formCheckout">
      <input type="text" id="checkoutNombre" placeholder="Nombre completo" required>
      <input type="tel" id="checkoutWhatsapp" placeholder="WhatsApp" required>
      <input type="email" id="checkoutCorreo" placeholder="Correo electrónico">

      <input type="text" id="checkoutDireccion" placeholder="Dirección" required>
      <input type="text" id="checkoutCiudad" placeholder="Ciudad" required>

      <div class="metodos-pago">
      <button type="button" class="metodo-pago-btn" data-metodo-pago="Nequi">
          Nequi
      </button>

      <button type="button" class="metodo-pago-btn" data-metodo-pago="Bancolombia">
          Bancolombia
      </button>

      <button type="button" class="metodo-pago-btn" data-metodo-pago="Contra entrega">
          Contra entrega
      </button>
      </div>
      <input type="file" id="checkoutComprobante" accept="image/*,.pdf">

      <textarea id="checkoutNotas" placeholder="Notas adicionales"></textarea>

      <button type="submit">Enviar pedido</button>
    </form>
  </div>
</div>

<button type="button" id="btnCarritoFlotante" class="carrito-flotante">
<i class="bi bi-cart"></i> <span id="contadorCarrito">0</span>
</button>

<script src="scripts.js?v=15"></script>

</body>
</html>
